[package]
name = "briny"
version = "0.15.0"
edition = "2021"
rust-version = "1.92.0"
description = "Low-level enforcement of memory layout integrity"
license = "MIT"
documentation = "https://docs.rs/briny"
keywords = ["security", "efficient", "no_std", "memory", "no_alloc"]
categories = [
    "no-std",
    "embedded",
    "data-structures",
    "memory-management",
    "no-std::no-alloc",
]
repository = "https://github.com/bobbothe2nd/briny"
readme = "README.md"

[dependencies]
half = { version = "2", optional = true, default-features = false }
stable_intr = { version = "0.1.2", optional = true, default-features = false }

[features]
default = ["half", "alloc", "nightly_intr"]

# depends on alloc, still no_std
alloc = []

# supports f16/bf16 via half dependency
half = ["dep:half"]

nightly = []

# supports f16/f128 via nightly
nightly_float = ["nightly"]

# intrinsics via nightly
nightly_intr = ["stable_intr/nightly", "stable_intr"]

# intrinsics via stable_intr dependency
stable_intr = ["stable_intr/transmute", "stable_intr/assert_type"]
